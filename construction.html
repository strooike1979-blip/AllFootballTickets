<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction - All Football Tickets</title>
    <link rel="icon" type="image/png" href="../../images/logo.png">
    
    <style>
        :root {
            --sidebar-bg: #1a1d23;
            --accent-color: rgb(255, 148, 0); 
            --text-light: #adb5bd;
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; overflow: hidden; }

        .app-wrapper { display: flex; min-height: 100vh; }

        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            color: white;
            padding: 20px;
            flex-shrink: 0;
            border-right: 3px solid var(--accent-color);
        }

        .sidebar-header { text-align: center; margin-bottom: 30px; }
        .sidebar-header img { width: 120px; }
        .sidebar-header h2 { font-size: 1.2rem; color: var(--accent-color); text-transform: uppercase; }

        .main-content { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            position: relative;
            background: #f4f7f6;
        }

        .animation-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .construction-text {
            font-size: 3rem;
            font-weight: 800;
            color: var(--sidebar-bg);
            text-transform: uppercase;
            letter-spacing: 5px;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
            animation-delay: 1s; 
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .football {
            position: absolute;
            left: -150px;
            width: 80px;
            height: 80px;
            background-color: #fff;
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 50%, #000 50%, #000 55%, transparent 55%),
                radial-gradient(circle at 10% 10%, #000 20%, transparent 20.5%),
                radial-gradient(circle at 90% 10%, #000 20%, transparent 20.5%),
                radial-gradient(circle at 50% 90%, #000 20%, transparent 20.5%),
                radial-gradient(circle at 10% 90%, #000 20%, transparent 20.5%),
                radial-gradient(circle at 90% 90%, #000 20%, transparent 20.5%);
            background-size: 40px 40px;
            border: 2px solid #333;
            border-radius: 50%;
            z-index: 10;
            animation: rollAcross 4s linear infinite;
        }

        @keyframes rollAcross {
            0% { left: -150px; transform: rotate(0deg); }
            100% { left: 110%; transform: rotate(720deg); }
        }

        .message { margin-top: 50px; text-align: center; color: #666; }

        .back-btn {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background: var(--sidebar-bg);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        .back-btn:hover { background: var(--accent-color); color: #1a1d23; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="../../images/logo.png" alt="Logo">
            <h2>Archive</h2>
        </div>
    </aside>

    <main class="main-content">
        <div class="animation-container">
            <div class="construction-text">UNDER CONSTRUCTION</div>
            <div class="football"></div>
        </div>

        <div class="message">
            <h2>Work in progress</h2>
            <a href="../../index.html" class="back-btn">Back to Home</a>
        </div>
    </main>
</div>

</body>
</html>
