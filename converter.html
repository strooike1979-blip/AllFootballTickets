<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Archive Converter Pro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; line-height: 1.6; background: #eef2f3; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { border-bottom: 2px solid #2ecc71; padding-bottom: 10px; color: #2c3e50; }
        textarea { width: 100%; height: 150px; margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; box-sizing: border-box; }
        .button-group { margin: 10px 0 20px 0; display: flex; gap: 10px; }
        button { padding: 12px 20px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.3s; }
        .btn-convert { background: #2ecc71; color: white; flex-grow: 1; }
        .btn-convert:hover { background: #27ae60; }
        .btn-copy { background: #3498db; color: white; }
        .btn-copy:hover { background: #2980b9; }
        pre { background: #272822; color: #f8f8f2; padding: 15px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; font-size: 13px; min-height: 50px; }
        .status { font-size: 14px; font-weight: bold; margin-left: 10px; color: #e67e22; }
    </style>
</head>
<body>

<div class="container">
    <h1>Match Archive Converter</h1>
    
    <label>Plak hier je ruwe data (Tab-gescheiden):</label>
    <textarea id="inputData" placeholder="#matchID	datum	thuis	uit	competitie	bestandsnaam"></textarea>
    
    <div class="button-group">
        <button class="btn-convert" onclick="convertData()">Converteer naar HTML</button>
        <button class="btn-copy" onclick="copyToClipboard()">Kopieer Resultaat</button>
        <span id="copyStatus" class="status"></span>
    </div>

    <label>Resultaat:</label>
    <pre id="outputCode"></pre>
</div>

<script>
    function convertData() {
        const input = document.getElementById('inputData').value;
        const lines = input.trim().split('\n');
        let finalHtml = "";

        lines.forEach(line => {
            const parts = line.split('\t');
            
            if (parts.length >= 6) {
                const id = parts[0].trim();
                const date = parts[1].trim();
                const home = parts[2].trim();
                const away = parts[3].trim();
                const comp = parts[4].trim();
                const file = parts[5].trim();

                const template = 
`<a href="../archief/${file}${id}" class="match-link" target="_blank">
    <div class="match-item">
        <div class="match-info">
            <span class="date">${date}</span>
            <span class="teams">${home} - ${away}</span>
            <span class="competition-tag">${comp}</span>
        </div>
        <div class="btn-detail">Bekijk</div>
    </div>
</a>`;
                finalHtml += template + "\n";
            }
        });

        document.getElementById('outputCode').innerText = finalHtml || "Geen geldige data gevonden...";
        document.getElementById('copyStatus').innerText = ""; // Reset status
    }

    async function copyToClipboard() {
        const code = document.getElementById('outputCode').innerText;
        const status = document.getElementById('copyStatus');
        
        if (!code || code.startsWith("Geen geldige")) return;

        try {
            await navigator.clipboard.writeText(code);
            status.innerText = "Gekopieerd! ✔️";
            status.style.color = "#2ecc71";
            setTimeout(() => { status.innerText = ""; }, 2000);
        } catch (err) {
            status.innerText = "Fout bij kopiëren ❌";
            status.style.color = "#e74c3c";
        }
    }
</script>

</body>
</html>
